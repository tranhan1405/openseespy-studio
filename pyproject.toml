[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openseespy-studio"
version = "0.2.0a1"
description = "SARE - Structural Analysis & Research Environment for OpenSees"
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [{name = "Tran-Van Han"}]
dependencies = [
  "PySide6>=6.7",
  "pyvista>=0.44",
  "pyvistaqt>=0.11",
  "numpy>=1.26",
  "openseespy>=3.8.0.0,<3.9",
  "openai>=1.68"
]

[project.scripts]
openseespy-studio = "openseespy_studio.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
openseespy_studio = [
  "resources/icons/*.svg",
  "resources/branding/*.svg",
  "resources/ground_motions/*.at2",
  "resources/ground_motions/*.json",
  "resources/ground_motions/*.txt",
  "resources/materials/*.json",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
markers = [
  "integration: tests that execute the real OpenSeesPy solver runtime",
]
