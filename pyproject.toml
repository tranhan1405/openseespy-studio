[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openseespy-studio"
version = "0.1.0"
description = "GUI pre/post processor for OpenSeesPy"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Tran-Van Han"}]
dependencies = [
  "PySide6>=6.7",
  "pyvista>=0.44",
  "pyvistaqt>=0.11",
  "numpy>=1.26",
  "openseespy>=3.7"
]

[project.scripts]
openseespy-studio = "openseespy_studio.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
openseespy_studio = ["resources/icons/*.svg"]

[tool.pytest.ini_options]
pythonpath = ["src"]
